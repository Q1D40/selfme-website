<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#030609">
  <meta name="description" content="SelfMe is building what comes next.">
  <title>SELFME</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="space-page">
    <div class="space-scene" aria-hidden="true">
      <canvas class="star-canvas"></canvas>
    </div>

    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <div class="brand-lockup">
          <img class="brand-mark" src="assets/selfme-logo.svg" alt="" aria-hidden="true">
          <span>SELFME</span>
        </div>

        <h1 id="hero-title">
          <span>仰望星空</span>
          <span>把流浪，变成轨道</span>
        </h1>
      </div>
      <p class="statement">未来不会从天而降</p>
    </section>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
